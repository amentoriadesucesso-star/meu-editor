<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Web Builder Pro v1.9.5 - AI Stable</title>
    <link rel="stylesheet" href="[https://unpkg.com/grapesjs/dist/css/grapes.min.css](https://unpkg.com/grapesjs/dist/css/grapes.min.css)">
    <script src="[https://unpkg.com/grapesjs](https://unpkg.com/grapesjs)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
    <style>
        :root { --primary: #3ecf8e; --ai: #a29bfe; --bg: #121212; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: #fff; overflow: hidden; }
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .editor-row { display: flex; height: 100vh; width: 100%; }
        #gjs { flex-grow: 1; border: none; }
        .panel__right { width: 320px; background: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; color: #ccc; }
        .action-buttons { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-bottom: 1px solid #333; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .btn-pub { background: var(--primary); color: #000; grid-column: span 2; }
        .btn-save { background: #333; color: white; }
        .tabs { display: flex; background: #151515; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 10px; font-weight: bold; border-bottom: 2px solid transparent; }
        .tab.active { border-bottom: 2px solid var(--primary); color: var(--primary); }
        .tab-ai.active { border-bottom-color: var(--ai); color: var(--ai); }
        #blocks, #traits, #ai-panel { flex: 1; overflow-y: auto; padding: 15px; background: #1a1a1a; }
        .hidden { display: none; }
        #ai-prompt { width: 100%; height: 100px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 6px; padding: 10px; box-sizing: border-box; resize: none; margin-bottom: 10px; outline: none; font-family: inherit; }
        .btn-ai { background: var(--ai); color: #000; width: 100%; }
        #ai-status { font-size: 11px; color: var(--ai); margin-top: 10px; text-align: center; }
        .gjs-block { background: #2d2d2d !important; color: #fff !important; border: 1px solid #444 !important; }
        .gjs-cv-canvas { width: calc(100% - 320px) !important; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="lock-screen" style="display:none;">
            <h2 style="color: var(--primary)">DASHBOARD v1.9.5</h2>
            <input type="password" id="pass-input" placeholder="Sua senha" style="padding:12px; border-radius:6px; text-align:center;" onkeydown="checkPass(event)">
        </div>

        <div class="editor-row">
            <div id="gjs" style="display:none;"></div>
            <div id="sidebar" class="panel__right" style="display:none;">
                <div class="action-buttons">
                    <button class="btn btn-pub" onclick="publishPage()">🚀 PUBLICAR NA WEB</button>
                    <button class="btn btn-save" onclick="saveToSupabase()">SALVAR</button>
                    <button class="btn btn-save" onclick="loadFromSupabase()">ABRIR</button>
                </div>
                <div class="tabs">
                    <div class="tab active" id="tab-blocks" onclick="switchTab('blocks')">ELEMENTOS</div>
                    <div class="tab" id="tab-traits" onclick="switchTab('traits')">AJUSTES</div>
                    <div class="tab tab-ai" id="tab-ai" onclick="switchTab('ai')">IA MAGIC</div>
                </div>
                <div id="blocks"></div>
                <div id="traits" class="hidden"><div id="traits-container"></div></div>
                <div id="ai-panel" class="hidden">
                    <textarea id="ai-prompt" placeholder="Ex: Crie uma seção de depoimentos com 3 colunas e estrelas amarelas..."></textarea>
                    <button class="btn btn-ai" onclick="generateAIBlock()">✨ GERAR COM IA</button>
                    <div id="ai-status"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MINHA_SENHA = "Ph17112017"; 
        const GEMINI_API_KEY = "AIzaSyDC9l8aWW5w_govNf44pv6ZitnxxGyoe1w"; 
        const SUPABASE_URL = '[https://jlegilyjmombwaixbdml.supabase.co](https://jlegilyjmombwaixbdml.supabase.co)'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZWdpbHlqbW9tYndhaXhiZG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NjI5MzYsImV4cCI6MjA4MzUzODkzNn0.8Bivhr8C1kkEAkh1szvDy5Z7HesSUQKwYsFXDeoVV18';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const pageName = urlParams.get('p');
            if (pageName) {
                const { data } = await _supabase.from('pages').select('html, css').eq('name', pageName).single();
                if (data) {
                    document.body.innerHTML = data.html + `<style>${data.css}</style>`;
                    document.querySelectorAll('script').forEach(s => { const n = document.createElement('script'); n.text = s.text; document.body.appendChild(n); });
                }
            } else { document.getElementById('lock-screen').style.display = 'flex'; }
        };

        function checkPass(e) { if (e.key === "Enter" && document.getElementById('pass-input').value === MINHA_SENHA) { document.getElementById('lock-screen').style.display = 'none'; document.getElementById('gjs').style.display = 'block'; document.getElementById('sidebar').style.display = 'block'; initEditor(); } }

        function switchTab(tab) {
            ['blocks', 'traits', 'ai'].forEach(t => {
                const p = document.getElementById(t + (t === 'ai' ? '-panel' : ''));
                if(p) p.classList.toggle('hidden', t !== tab);
                document.getElementById('tab-' + t).classList.toggle('active', t === tab);
            });
        }

        async function generateAIBlock() {
            const prompt = document.getElementById('ai-prompt').value;
            const status = document.getElementById('ai-status');
            if (!prompt) return;
            
            status.innerText = "IA está processando...";
            
            try {
                // VOLTAMOS PARA v1beta QUE É MAIS PERMISSIVA COM O MODELO FLASH
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Retorne APENAS o código HTML puro com CSS inline para este pedido: " + prompt + ". Não use markdown, não explique nada." }] }] })
                });

                const data = await response.json();
                
                if (data.error) {
                    status.innerText = "Erro: " + data.error.message;
                    return;
                }

                let html = data.candidates[0].content.parts[0].text;
                
                // LIMPADEIRA DE CÓDIGO (Remove aspas e tags de markdown)
                html = html.replace(/```html/g, "").replace(/```/g, "").replace(/'''/g, "").trim();
                
                editor.addComponents(html);
                status.innerText = "Pronto! Seção inserida.";
            } catch (e) {
                status.innerText = "Erro crítico. Verifique o console.";
            }
        }

        function initEditor() {
            window.editor = grapesjs.init({
                container: '#gjs', height: '100vh', width: 'auto', storageManager: false,
                traitManager: { appendTo: '#traits-container' },
                blockManager: { appendTo: '#blocks', blocks: [
                    { id: 'b1', label: 'Seção', content: '<section style="padding:50px; text-align:center;">Nova Seção</section>' },
                    { id: 'b2', label: 'Texto', content: '<div style="padding:10px;">Texto de exemplo</div>' }
                ]}
            });
            editor.on('component:selected', () => switchTab('traits'));
        }

        async function saveToSupabase() {
            const name = prompt("Nome da página:");
            if (name) await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() }, { onConflict: 'name' });
            alert("Salvo!");
        }

        async function publishPage() {
            const name = prompt("Nome da URL:");
            if (name) {
                await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() }, { onConflict: 'name' });
                alert("No ar! " + window.location.href.split('?')[0] + "?p=" + name);
            }
        }

        async function loadFromSupabase() {
            const { data } = await _supabase.from('pages').select('*').order('id', { ascending: false }).limit(1);
            if (data[0]) { editor.setComponents(data[0].html); editor.setStyle(data[0].css); }
        }
    </script>
</body>
</html>
