<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Web Builder Pro v2.1 - AI Stabilized</title>
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3ecf8e; --ai: #a29bfe; --bg: #121212; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
        
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #lock-screen input { padding: 15px; border-radius: 8px; border: 1px solid #444; background: #2d2d2d; color: white; width: 280px; text-align: center; font-size: 18px; outline: none; }

        #main-editor { display: none; width: 100%; height: 100vh; flex-direction: row; }
        #gjs { flex-grow: 1; background: #fff; }
        
        .sidebar { width: 320px; background: #252525; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .action-buttons { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-bottom: 1px solid #333; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .btn-pub { background: var(--primary); color: #000; grid-column: span 2; }
        .btn-save { background: #444; color: white; }
        
        .tabs { display: flex; background: #151515; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 10px; border-bottom: 2px solid transparent; }
        .tab.active { border-bottom: 2px solid var(--primary); color: var(--primary); }
        
        #blocks, #traits, #ai-panel { flex: 1; overflow-y: auto; padding: 15px; background: #1a1a1a; }
        .hidden { display: none; }

        #ai-prompt { width: 100%; height: 100px; background: #2d2d2d; color: white; border: 1px solid #444; border-radius: 6px; padding: 10px; box-sizing: border-box; resize: none; }
        .btn-ai { background: var(--ai); color: #000; width: 100%; margin-top: 10px; }
        #ai-status { font-size: 11px; color: var(--ai); margin-top: 10px; text-align: center; line-height: 1.4; }
        
        .gjs-cv-canvas { width: calc(100% - 320px) !important; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2 style="color: var(--primary); margin-bottom: 20px;">BUILDER AI MAGIC v2.1</h2>
        <input type="password" id="pass-input" placeholder="Sua senha" onkeydown="checkPass(event)">
    </div>

    <div id="main-editor">
        <div id="gjs"></div>
        <div class="sidebar">
            <div class="action-buttons">
                <button class="btn btn-pub" onclick="publishPage()">🚀 PUBLICAR</button>
                <button class="btn btn-save" onclick="saveToSupabase()">SALVAR</button>
                <button class="btn btn-save" onclick="loadFromSupabase()">ABRIR</button>
            </div>
            <div class="tabs">
                <div class="tab active" id="tab-blocks" onclick="switchTab('blocks')">BLOCOS</div>
                <div class="tab" id="tab-traits" onclick="switchTab('traits')">AJUSTES</div>
                <div class="tab" id="tab-ai" onclick="switchTab('ai')">IA MAGIC</div>
            </div>
            <div id="blocks"></div>
            <div id="traits" class="hidden"><div id="traits-container"></div></div>
            <div id="ai-panel" class="hidden">
                <textarea id="ai-prompt" placeholder="Ex: Crie uma seção de depoimentos dark mode com 3 colunas..."></textarea>
                <button class="btn btn-ai" onclick="generateAIBlock()">✨ GERAR SEÇÃO</button>
                <div id="ai-status"></div>
            </div>
        </div>
    </div>

    <script>
        const MINHA_SENHA = "Ph17112017"; 
        const GEMINI_API_KEY = "AIzaSyDC9l8aWW5w_govNf44pv6ZitnxxGyoe1w"; 
        const SUPABASE_URL = 'https://jlegilyjmombwaixbdml.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZWdpbHlqbW9tYndhaXhiZG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NjI5MzYsImV4cCI6MjA4MzUzODkzNn0.8Bivhr8C1kkEAkh1szvDy5Z7HesSUQKwYsFXDeoVV18';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function checkPass(e) {
            if (e.key === "Enter" && document.getElementById('pass-input').value === MINHA_SENHA) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-editor').style.display = 'flex';
                initEditor();
            }
        }

        function switchTab(tab) {
            ['blocks', 'traits', 'ai'].forEach(t => {
                const p = document.getElementById(t + (t === 'ai' ? '-panel' : ''));
                if(p) p.classList.toggle('hidden', t !== tab);
                document.getElementById('tab-' + t).classList.toggle('active', t === tab);
            });
        }

        async function generateAIBlock() {
            const prompt = document.getElementById('ai-prompt').value;
            const status = document.getElementById('ai-status');
            if (!prompt) return;
            
            status.innerText = "IA está processando... Aguarde.";
            
            try {
                // ENDPOINT ATUALIZADO v1beta com models/ prefixo
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Gere o código HTML puro com estilos CSS inline para: " + prompt + ". Retorne apenas o código HTML, sem markdown (sem crases) e sem explicações." }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    status.innerHTML = `<span style="color:#ff4757">Erro Google: ${data.error.message}</span>`;
                    return;
                }

                let html = data.candidates[0].content.parts[0].text;
                // Limpeza agressiva de markdown
                html = html.replace(/```html/g, "").replace(/```/g, "").replace(/'''/g, "").trim();
                
                editor.addComponents(html);
                status.innerText = "✅ Seção inserida com sucesso!";
                
            } catch (e) {
                status.innerHTML = `<span style="color:#ff4757">Erro de conexão. Verifique o console (F12).</span>`;
                console.error(e);
            }
        }

        function initEditor() {
            window.editor = grapesjs.init({
                container: '#gjs', height: '100vh', width: 'auto', storageManager: false,
                traitManager: { appendTo: '#traits-container' },
                blockManager: { appendTo: '#blocks', blocks: [
                    { id: 'sec', label: 'Seção', content: '<section style="padding:40px; text-align:center;">Nova Seção</section>' },
                    { id: 'txt', label: 'Texto', content: '<div style="padding:10px;">Texto de exemplo</div>' }
                ]}
            });
            editor.on('component:selected', () => switchTab('traits'));
        }

        async function saveToSupabase() {
            const name = prompt("Nome da página:");
            if (name) await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() }, { onConflict: 'name' });
            alert("Salvo!");
        }

        async function publishPage() {
            const name = prompt("Nome da URL:");
            if (name) {
                await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() }, { onConflict: 'name' });
                alert("Publicado! Link: " + window.location.origin + window.location.pathname + "?p=" + name);
            }
        }

        async function loadFromSupabase() {
            const { data } = await _supabase.from('pages').select('*').order('id', { ascending: false }).limit(1);
            if (data[0]) { editor.setComponents(data[0].html); editor.setStyle(data[0].css); }
        }
    </script>
</body>
</html>
