<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Builder AI - Private Edition v3.0</title>
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #3ecf8e; --accent: #8e44ad; --bg: #0f172a; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; background: #fff; }
        
        /* Proteção de Acesso ao Editor */
        #lock-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #lock-screen input { padding: 15px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; width: 280px; text-align: center; font-size: 18px; outline: none; margin-top: 20px; }

        /* Interface do Builder */
        #main-builder { display: none; width: 100%; height: 100vh; flex-direction: row; }
        #gjs { flex-grow: 1; }
        
        .sidebar { width: 320px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; color: #f1f5f9; }
        .top-nav { padding: 15px; background: #0f172a; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        .btn { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; transition: 0.3s; }
        .btn-main { background: var(--primary); color: #0f172a; grid-column: span 2; }
        .btn-alt { background: #334155; color: white; }
        
        .tabs { display: flex; background: #0f172a; margin-top: 5px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 11px; font-weight: bold; opacity: 0.6; border-bottom: 2px solid transparent; }
        .tab.active { opacity: 1; border-bottom-color: var(--primary); color: var(--primary); }

        #blocks-container, #style-container, #clone-container { flex: 1; overflow-y: auto; padding: 15px; }
        .hidden { display: none; }

        /* Estilização dos Blocos Estilo Atomicat */
        .gjs-block { width: 100% !important; min-height: auto !important; background: #334155 !important; color: white !important; border: 1px solid #475569 !important; border-radius: 6px !important; margin-bottom: 8px !important; padding: 15px !important; }
        .gjs-block:hover { border-color: var(--primary) !important; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2 style="color: var(--primary); letter-spacing: 2px;">BUILDER PRIVATE v3.0</h2>
        <input type="password" id="pass-input" placeholder="Senha de Acesso" onkeydown="handleLogin(event)">
    </div>

    <div id="main-builder">
        <div id="gjs"></div>
        
        <div class="sidebar">
            <div class="top-nav">
                <button class="btn btn-main" onclick="publishNow()">🚀 PUBLICAR PÁGINA VIVA</button>
                <button class="btn btn-alt" onclick="saveProject()">SALVAR</button>
                <button class="btn btn-alt" onclick="loadLast()">ABRIR</button>
            </div>

            <div class="tabs">
                <div class="tab active" id="tab-blocks" onclick="showTab('blocks')">BLOCOS</div>
                <div class="tab" id="tab-style" onclick="showTab('style')">DESIGN</div>
                <div class="tab" id="tab-clone" onclick="showTab('clone')">CLONAR</div>
            </div>

            <div id="blocks-container">
                <div id="gjs-blocks"></div>
            </div>

            <div id="style-container" class="hidden">
                <div id="gjs-traits"></div>
            </div>

            <div id="clone-container" class="hidden">
                <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">Cole o código HTML de qualquer página para clonar o design:</p>
                <textarea id="import-code" style="width:100%; height:150px; background:#0f172a; color:#3ecf8e; border:1px solid #334155; padding:10px; font-size:10px;" placeholder="<html>..."></textarea>
                <button class="btn btn-main" style="margin-top:10px;" onclick="importHTML()">IMPORTAR AGORA</button>
            </div>
        </div>
    </div>

    <script>
        const SENHA_MESTRA = "Ph17112017";
        const SUPABASE_URL = 'https://jlegilyjmombwaixbdml.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsZWdpbHlqbW9tYndhaXhiZG1sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NjI5MzYsImV4cCI6MjA4MzUzODkzNn0.8Bivhr8C1kkEAkh1szvDy5Z7HesSUQKwYsFXDeoVV18';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Lógica de Visualização vs Edição
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const p = params.get('p');

            if (p) {
                // MODO PÚBLICO (GHOST): Carrega a página limpa
                const { data } = await _supabase.from('pages').select('html, css').eq('name', p).single();
                if (data) {
                    document.body.innerHTML = data.html + `<style>${data.css}</style>`;
                    document.body.style.overflow = 'auto';
                }
            } else {
                // MODO EDITOR: Pede senha
                document.getElementById('lock-screen').style.display = 'flex';
            }
        };

        function handleLogin(e) {
            if (e.key === "Enter" && document.getElementById('pass-input').value === SENHA_MESTRA) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-builder').style.display = 'flex';
                startEditor();
            }
        }

        function showTab(name) {
            ['blocks', 'style', 'clone'].forEach(t => {
                document.getElementById(t + '-container').classList.toggle('hidden', t !== name);
                document.getElementById('tab-' + t).classList.toggle('active', t === name);
            });
        }

        function startEditor() {
            window.editor = grapesjs.init({
                container: '#gjs', height: '100vh', width: 'auto', storageManager: false,
                traitManager: { appendTo: '#gjs-traits' },
                blockManager: { appendTo: '#gjs-blocks', blocks: [
                    { id: 'h1', label: '<i class="fa fa-heading"></i> Headline', content: '<h1 style="text-align:center; padding:20px; color:#1e293b;">Sua Headline Matadora</h1>' },
                    { id: 'wpp', label: '<i class="fab fa-whatsapp"></i> Zap Flutuante', content: '<a href="https://wa.me/55..." style="position:fixed; bottom:20px; right:20px; background:#25d366; color:white; padding:15px; border-radius:50%; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index:999;"><i class="fab fa-whatsapp fa-2x"></i></a>' },
                    { id: 'vsl', label: '<i class="fa fa-play"></i> Vídeo VSL', content: '<div style="background:#000; padding:56.25% 0 0 0; position:relative; margin:20px;"><div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:white;">SEU VÍDEO AQUI</div></div>' },
                    { id: 'timer', label: '<i class="fa fa-clock"></i> Cronômetro', content: '<div style="background:#f1f5f9; padding:20px; text-align:center; border:2px solid #ef4444;"><p style="color:#ef4444; font-weight:bold;">A OFERTA EXPIRE EM:</p><div style="font-size:32px; font-weight:900;">14:59</div></div>' }
                ]}
            });
            editor.on('component:selected', () => showTab('style'));
        }

        function importHTML() {
            const code = document.getElementById('import-code').value;
            if (code) { editor.setComponents(code); alert("Design Importado!"); }
        }

        async function publishNow() {
            const name = prompt("Defina o link (ex: vsl-leilao):");
            if (!name) return;
            await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() });
            const finalLink = window.location.origin + window.location.pathname + "?p=" + name;
            alert("Sua página está AO VIVO e Pública!\n\nLink: " + finalLink);
            window.open(finalLink, '_blank');
        }

        async function saveProject() {
            const name = prompt("Nome do projeto:");
            if (name) await _supabase.from('pages').upsert({ name, html: editor.getHtml(), css: editor.getCss() });
            alert("Salvo!");
        }

        async function loadLast() {
            const { data } = await _supabase.from('pages').select('*').order('id', { ascending: false }).limit(1);
            if (data[0]) { editor.setComponents(data[0].html); editor.setStyle(data[0].css); }
        }
    </script>
</body>
</html>
